name: "Sync TRaSH-Guides: stable + v2"

on:
  schedule:
    - cron: "31 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: stable
          path: stable

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15.2"

      - name: Install uv
        run: pip install uv

      - name: Clone TRaSH-Guides for stable
        run: git clone --depth 1 https://github.com/TRaSH-Guides/Guides.git TRaSH-Guides
        working-directory: stable

      - name: Install stable project dependencies
        run: uv sync --extra dev
        working-directory: stable

      - name: Generate and test v1 database
        run: |
          uv run scripts/generate.py TRaSH-Guides/docs/json .
          uv run pytest tests
        working-directory: stable

      - name: Detect stable updates
        id: stable-generated
        working-directory: stable
        run: |
          git add regex_patterns/ custom_formats/ profiles/ media_management/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push stable update
        if: steps.stable-generated.outputs.changed == 'true'
        working-directory: stable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Automated TRaSH-Guides update"
          git push origin HEAD:stable

  update-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v2
          path: v2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15.2"

      - name: Install uv
        run: pip install uv

      - name: Clone TRaSH-Guides for v2
        run: git clone --depth 1 https://github.com/TRaSH-Guides/Guides.git TRaSH-Guides
        working-directory: v2

      - name: Install v2 project dependencies
        run: uv sync --extra dev
        working-directory: v2

      - name: Generate and validate PCD
        run: |
          uv run scripts/generate.py TRaSH-Guides/docs/json .
          uv run scripts/validate.py .
          uv run pytest -q
          uv run pylint scripts tests
        working-directory: v2

      - name: Detect generated updates
        id: generated
        working-directory: v2
        run: |
          git add ops/ pcd.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare temporary import branch
        id: import_branch
        if: steps.generated.outputs.changed == 'true'
        working-directory: v2
        run: |
          branch="ci/profilarr-import-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Automated TRaSH-Guides update"
          git push origin "HEAD:refs/heads/$branch"

      - name: Verify generated PCD import in Profilarr
        if: steps.generated.outputs.changed == 'true'
        timeout-minutes: 20
        working-directory: v2
        env:
          PCD_REPOSITORY_URL: https://github.com/${{ github.repository }}
          PCD_BRANCH: ${{ steps.import_branch.outputs.branch }}
        run: |
          uv run scripts/check_pcd_import.py \
            --repository-url "$PCD_REPOSITORY_URL" \
            --branch "$PCD_BRANCH"

      - name: Delete temporary import branch
        if: ${{ always() && steps.import_branch.outputs.branch != '' }}
        env:
          TEMP_BRANCH: ${{ steps.import_branch.outputs.branch }}
        run: git -C v2 push origin --delete "$TEMP_BRANCH"

      - name: Push v2 update
        if: steps.generated.outputs.changed == 'true'
        working-directory: v2
        run: |
          git push origin HEAD:v2
